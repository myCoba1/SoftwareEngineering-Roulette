name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests with coverage
        # Note: 'sbt coverageReport' is redundant here as 'sbt coveralls' runs it,
        # but it's fine for verification. We run clean, coverage, and test.
        run: sbt clean coverage test

      - name: Submit Coverage to Coveralls
        # This step runs the sbt plugin command
        run: sbt coveralls
        env:
          # This is the CRITICAL line. It passes the secret to the sbt command.
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libxrender1

      - name: Run tests with coverage
        run: xvfb-run sbt clean coverage test coverageAggregate

      - name: Verify coverage output
        run: |
          pwd
          ls
          ls -R target || true
          find . -name "scoverage.xml" || true

      - name: Submit coverage to Coveralls
        run: sbt coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Setup JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      # Setup sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Install system dependencies needed for xvfb
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxtst6 libxrender1

      # Run tests with coverage
      - name: Run tests with coverage
        run: xvfb-run sbt clean coverage test coverageAggregate

      # Verify coverage output exists
      - name: Verify coverage output
        run: |
          echo "PWD: $(pwd)"
          ls -R target || true
          if [ ! -f target/scala-3.3.7/scoverage-report/scoverage.xml ]; then
            echo "ERROR: Coverage file not found!"
            exit 1
          fi

      # Submit coverage to Coveralls
      - name: Submit coverage to Coveralls
        run: sbt coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}